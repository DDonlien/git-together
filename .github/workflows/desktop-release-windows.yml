name: Desktop Windows release packages
run-name: Windows release ${{ inputs.version }} (${{ inputs.source_commit }})
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact commit selected by the release tag
        required: true
      version:
        description: Product version
        required: true
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    env:
      GITTOGETHER_RELEASE_VERSION: ${{ inputs.version }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: x64
      - run: '"GITTOGETHER_BUILD_NODE=$(node -p process.execPath)" >> $env:GITHUB_ENV'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.arch == 'x86'
        run: rustup default stable-i686-pc-windows-msvc --force-non-host
      - run: npm run verify:upstream
      - run: npm run setup
      - run: npm run check
      - run: npm test
      - run: npm run build:release
      # Build application files only from source_commit. Release tooling may
      # advance independently without changing the packaged source provenance.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: artifacts/release-pipeline
      - name: Package with the 64-bit build host
        shell: pwsh
        run: |
          $env:GITTOGETHER_SOURCE_ROOT = $env:GITHUB_WORKSPACE
          $env:GITTOGETHER_PACKAGE_ARCH = if ('${{ matrix.arch }}' -eq 'x86') { 'ia32' } else { 'x64' }
          & $env:GITTOGETHER_BUILD_NODE artifacts/release-pipeline/scripts/package-desktop.mjs
          exit $LASTEXITCODE
      - name: Validate the installed target architecture
        run: node artifacts/release-pipeline/scripts/smoke-windows-package.mjs
        env:
          GITTOGETHER_SOURCE_ROOT: ${{ github.workspace }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-${{ matrix.arch }}
          path: |
            artifacts/releases/${{ inputs.version }}/*.exe
            artifacts/releases/${{ inputs.version }}/*.nupkg
            artifacts/releases/${{ inputs.version }}/RELEASES-*
            artifacts/releases/${{ inputs.version }}/package-*.json
            artifacts/releases/${{ inputs.version }}/windows-smoke-*.json
          if-no-files-found: error
