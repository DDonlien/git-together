[package]
name = "gittogether"
version = "0.22.4"
edition = "2021"
rust-version = "1.90"
default-run = "gittogether"

[lib]
name = "gittogether_core"
crate-type = ["lib", "staticlib", "cdylib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "=2.12.2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-updater = "2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "native-tls", "system-proxy"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
sha1 = "0.10"
pbkdf2 = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
aes-gcm = "0.10"
base64 = "0.22"
minisign-verify = "0.2"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
percent-encoding = "2"
tempfile = "3"
walkdir = "2"
rusty-leveldb = "4"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
