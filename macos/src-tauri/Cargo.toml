[package]
name = "gittogether"
version = "0.33.0"
edition = "2021"
rust-version = "1.90"
default-run = "gittogether"

[lib]
name = "gittogether_core"
crate-type = ["lib", "staticlib", "cdylib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "=2.12.2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "native-tls", "system-proxy"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
sha1 = "0.10"
pbkdf2 = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
aes-gcm = "0.10"
base64 = "0.22"
minisign-verify = "0.2"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
percent-encoding = "2"
tempfile = "3"
trash = "=5.2.9"
walkdir = "2"
regex = "1"
flate2 = "1"
tar = "0.4"
rusty-leveldb = "4"
libc = "0.2"
dunce = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_Com", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
